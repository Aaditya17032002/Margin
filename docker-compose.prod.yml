# Margin — server deploy (shared host)
# Publishes only host port 8088 → Caddy :80 so we do not fight nginx (80/443)
# or ACHGuard (8081). Reach the app at http://<host>:8088

name: margin

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - web
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${MARGIN_FRONTEND_IMAGE:-aditya17032002/margin-frontend:latest}
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - web
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M

  backend:
    image: ${MARGIN_BACKEND_IMAGE:-aditya17032002/margin-backend:latest}
    restart: unless-stopped
    expose:
      - "8000"
    env_file: .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web
      - internal
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - reports:/srv/reports
      - uploads:/srv/uploads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M

  worker:
    image: ${MARGIN_WORKER_IMAGE:-aditya17032002/margin-worker:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - web
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - reports:/srv/reports
      - uploads:/srv/uploads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: margin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-margin}
      POSTGRES_DB: margin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M

volumes:
  pgdata:
  reports:
  uploads:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: true
